[project]
name = "ai-platform-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "tabular",
    "pydicom>=3.0.2",
    "minio>=7.2.20",
    "python-multipart>=0.0.32",
    "kubernetes>=31",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# TestClient 要用 httpx2；若退回 httpx，Starlette 的棄用警告直接當成錯誤
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]

[tool.uv.sources]
tabular = { path = "../libs/tabular", editable = true }
