[project]
name = "importer"
version = "0.1.0"
description = "Batch image importer for the medical AI platform (uploads through the API gateway)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
