[project]
name = "synth"
version = "0.1.0"
description = "Deterministic synthetic test data for the medical AI platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nibabel>=5.4.2",
    "numpy>=2.5.3",
    "pydicom>=3.0.2",
    "simpleitk>=2.5.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
