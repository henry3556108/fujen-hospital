[project]
name = "autolabel-adapter"
version = "1.0.0"
description = "MONAI Label 轉接服務：以自動標註規格 1.0（docs/specs/autolabel-io-format.md）提供 MONAI Label 的分割模型"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=2.1",
    "pydicom>=3.0",
    "nibabel>=5.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
