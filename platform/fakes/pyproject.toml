[project]
name = "fakes"
version = "0.1.0"
description = "Fake LLM (OpenAI-compatible) and auto-labeling (MONAI Label subset) services for smoke tests. Never deploy to production."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
