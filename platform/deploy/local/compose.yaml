name: ai-platform
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform-dev
      POSTGRES_DB: platform
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: kcadmin-dev
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: platform
      KC_DB_PASSWORD: platform-dev
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-ai-platform.json:/opt/keycloak/data/import/realm-ai-platform.json:ro
    ports: ["${KEYCLOAK_HOST_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg://platform:platform-dev@postgres:5432/platform
      OIDC_ISSUER: http://localhost:8080/realms/ai-platform
      OIDC_AUDIENCE: ai-platform
      OIDC_JWKS_URL: http://keycloak:8080/realms/ai-platform/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ai-platform
      KEYCLOAK_CLIENT_ID: ai-platform-api
      KEYCLOAK_CLIENT_SECRET: api-secret-dev
      STORAGE_ROOT: /data/objects
      # WP2：影像節點與物件儲存（本機測試值）
      STORAGE_BACKEND: s3
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: platform-api            # minio-init 建立的專用帳號，只能讀寫 S3_BUCKET；不是 MinIO root
      S3_SECRET_KEY: platform-api-dev-secret
      S3_BUCKET: platform
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: platform-api
      ORTHANC_PASSWORD: orthanc-api-dev
      ORTHANC_PACS_MODALITY: pacs
    volumes:
      - objects:/data/objects
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
      orthanc: {condition: service_started}
      minio-init: {condition: service_completed_successfully}

  apisix:
    image: apache/apisix:3.11.0-debian
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports: ["${GATEWAY_HOST_PORT:-9080}:9080"]
    depends_on: [api, orthanc]

  # 平台自己的 DICOM 節點（DICOMweb 外掛）。不對主機開放：DICOMweb 只能經 Gateway 的 /dicomweb/projects/{pid}/
  orthanc:
    image: jodogne/orthanc-plugins:1.13.0
    platform: linux/amd64
    volumes:
      - ./orthanc/platform:/etc/orthanc:ro
      - orthanc-db:/var/lib/orthanc/db

  # 模擬醫院 PACS：平台節點以 C-FIND／C-MOVE 向它查詢取像。REST 只綁 127.0.0.1，給驗收測試放入研究
  orthanc-pacs:
    image: jodogne/orthanc-plugins:1.13.0
    platform: linux/amd64
    volumes:
      - ./orthanc/pacs:/etc/orthanc:ro
      - orthanc-pacs-db:/var/lib/orthanc/db
    ports: ["127.0.0.1:${PACS_HTTP_PORT:-8043}:8042"]

  # S3 相容物件儲存（NIfTI／ITK／標註檔）。不對主機開放
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: minio-dev
      MINIO_ROOT_PASSWORD: minio-dev-secret
    volumes:
      - minio-data:/data

  # 一次性：建立 bucket 與平台 API 的最小權限帳號（app/storage_init.py）。root 金鑰只出現在 minio 與這個服務
  minio-init:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    command: ["/app/.venv/bin/python", "-m", "app.storage_init"]
    restart: "no"
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: minio-dev
      MINIO_ROOT_PASSWORD: minio-dev-secret
      S3_BUCKET: platform
      S3_ACCESS_KEY: platform-api
      S3_SECRET_KEY: platform-api-dev-secret
    depends_on:
      minio: {condition: service_started}

volumes:
  pgdata: {}
  objects: {}
  orthanc-db: {}
  orthanc-pacs-db: {}
  minio-data: {}
