# Gateway 另開 9081 給 OHIF 檢視器（compose.labeling.yaml 才對主機開放；路由見 apisix.yaml 的 WP5a 區塊）
apisix:
  node_listen:
    - 9080
    - 9081
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
# WP6：上游以 Docker 內建 DNS 做服務發現（FHIR 水平擴充用）。只查 A 記錄
discovery:
  dns:
    servers:
      - "127.0.0.11:53"
    order:
      - last
      - A
