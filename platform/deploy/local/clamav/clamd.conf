# clamd 設定（本機整合環境）。上傳掃毒走 TCP 3310 的 INSTREAM。
# 大小上限要不小於平台的單檔上限（影像 IMAGING_MAX_FILE_MB 預設 512 MB），否則大檔會被拒絕上傳。
LogFile /dev/stdout
LogTime yes
PidFile /tmp/clamd.pid
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
Foreground yes
StreamMaxLength 600M
MaxFileSize 600M
MaxScanSize 1200M
MaxThreads 4
ReadTimeout 120
