# 由 platform/deploy/k8s/render-config.py 從 platform/deploy/local/apisix/config.yaml 產生，請改原始檔後重新產生
# Gateway 另開 9081 給 OHIF 檢視器（compose.labeling.yaml 才對主機開放；路由見 apisix.yaml 的 WP5a 區塊）
# 9082 給網頁前端（compose.web.yaml 才對主機開放）：網頁與 /api 同源，不需要 CORS
apisix:
  node_listen:
    - 9080
    - 9081
    - 9082
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
# WP6：上游以叢集 DNS 做服務發現（headless Service）（FHIR 水平擴充用）。只查 A 記錄
discovery:
  dns:
    servers:
      - "${{DNS_SERVER}}:53"
    order:
      - last
      - A
# 監控：prometheus 外掛的指標匯出埠 9091（預設只聽 127.0.0.1，其他 Pod 連不到）。
# compose 不對主機開放；Kubernetes 只讓 monitoring 命名空間連入（k8s/base/networkpolicy.yaml 的 metrics-apisix）
plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
# Kubernetes：apisix.yaml 內以 ${{VAR}} 引用的環境變數，nginx worker 要宣告才讀得到
nginx_config:
  worker_processes: 2   # 預設依 CPU 數開 worker，每個約 30 MB；平台節點記憶體有限
  envs:
    - DNS_SERVER
    - ORTHANC_GATEWAY_AUTH
    - CORS_ALLOW_ORIGINS
    - DICOMWEB_CORS_REGEX
