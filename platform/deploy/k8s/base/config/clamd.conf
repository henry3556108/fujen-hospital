# clamd 設定（本機整合環境）。上傳掃毒走 TCP 3310 的 INSTREAM。
# 大小上限要不小於平台的單檔上限（影像 IMAGING_MAX_FILE_MB 預設 512 MB），否則大檔會被拒絕上傳。
# 不設 LogFile：Foreground 模式下訊息直接寫到容器輸出（設成 /dev/stdout 會出現 Symbolic link loop）
PidFile /tmp/clamd.pid
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
Foreground yes
StreamMaxLength 600M
MaxFileSize 600M
MaxScanSize 1200M
MaxThreads 4
ReadTimeout 120
# Kubernetes（render-config.py 加入）：重載病毒碼時不同時保留兩份，記憶體上限才能設在 2 GB 以下
ConcurrentDatabaseReload no
