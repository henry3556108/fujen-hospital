# PostgreSQL 16 + pgvector：平台、Keycloak、Wiki.js、HAPI FHIR 的資料庫（db-init 工作建立各資料庫，可重複執行）
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      nodeSelector: {platform/pool: cpu-web}
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: postgres
          image: ai-platform/postgres
          env:
            - {name: POSTGRES_USER, value: platform}
            - {name: POSTGRES_DB, value: platform}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: POSTGRES_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          args: ["-c", "shared_buffers=64MB", "-c", "max_connections=200"]
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "platform", "-h", "127.0.0.1"]}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "platform", "-h", "127.0.0.1"]}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 750m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 10Gi}
