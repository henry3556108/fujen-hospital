# FHIR 排程 worker：與平台 API 同一個映像，輪詢到期的排程並執行。沒有連接埠，沒有探針（程序結束就重啟）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: fhir-worker}
  template:
    metadata:
      labels: {app: fhir-worker, platform/backend: "true", platform/db-client: "true"}
    spec:
      nodeSelector: {platform/pool: cpu-web}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: worker
          image: ai-platform/api
          command: ["/app/.venv/bin/python", "-m", "app.fhir.worker"]
          envFrom:
            - configMapRef: {name: api-env}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: POSTGRES_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql+psycopg://platform:$(POSTGRES_PASSWORD)@postgres:5432/platform"}
          resources:
            requests: {cpu: 20m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
