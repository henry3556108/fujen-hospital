# 平台自己的 DICOM 節點（DICOMweb 外掛）。只接受 Gateway（DICOMweb，換上 gateway 帳號）、平台後端與 PACS 的 C-STORE。
# 設定檔的帳號密碼與 PACS 位址是 ${VAR} 佔位，Orthanc 讀設定時以環境變數替換。
apiVersion: v1
kind: Service
metadata:
  name: orthanc
spec:
  selector: {app: orthanc}
  ports:
    - {name: http, port: 8042, targetPort: 8042}
    - {name: dicom, port: 4242, targetPort: 4242}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orthanc
spec:
  serviceName: orthanc
  replicas: 1
  selector:
    matchLabels: {app: orthanc}
  template:
    metadata:
      labels: {app: orthanc}
    spec:
      nodeSelector: {platform/pool: cpu-web}
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: orthanc
          image: ai-platform/orthanc
          env:
            - name: ORTHANC_API_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: ORTHANC_API_PASSWORD}}
            - name: ORTHANC_GATEWAY_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: ORTHANC_GATEWAY_PASSWORD}}
            # 醫院 PACS（C-FIND／C-MOVE 的對象）；kind 是模擬 PACS，甲方填實際的 AE Title、主機、連接埠
            - name: PACS_AET
              valueFrom: {configMapKeyRef: {name: pacs, key: PACS_AET}}
            - name: PACS_HOST
              valueFrom: {configMapKeyRef: {name: pacs, key: PACS_HOST}}
            - name: PACS_PORT
              valueFrom: {configMapKeyRef: {name: pacs, key: PACS_PORT}}
          ports:
            - {name: http, containerPort: 8042}
            - {name: dicom, containerPort: 4242}
          readinessProbe:
            tcpSocket: {port: 8042}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: 8042}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 750m, memory: 768Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/orthanc, readOnly: true}
            - {name: data, mountPath: /var/lib/orthanc/db}
      volumes:
        - name: config
          configMap: {name: orthanc-config}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 20Gi}
