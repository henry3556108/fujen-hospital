# 平台 API。只經 Gateway 對外；ServiceAccount platform-api 送訓練與推論 Job 到 platform-jobs（rbac.yaml）。
# /data/objects 只放 LLM 模型目錄（物件都在 MinIO），用 PVC，所以一個副本、Recreate。
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-objects
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, platform/backend: "true", platform/db-client: "true"}
    spec:
      nodeSelector: {platform/pool: cpu-web}
      serviceAccountName: platform-api
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: ai-platform/api
          envFrom:
            - configMapRef: {name: api-env}
            - configMapRef: {name: platform-images}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: POSTGRES_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql+psycopg://platform:$(POSTGRES_PASSWORD)@postgres:5432/platform"}
            - name: KC_HOSTNAME
              valueFrom: {configMapKeyRef: {name: platform-urls, key: KC_HOSTNAME}}
            - {name: OIDC_ISSUER, value: "$(KC_HOSTNAME)/realms/ai-platform"}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: platform-secrets, key: KC_API_CLIENT_SECRET}}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: platform-secrets, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: platform-secrets, key: S3_SECRET_KEY}}
            - name: ORTHANC_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: ORTHANC_API_PASSWORD}}
            - name: INFERENCE_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: platform-secrets, key: INFERENCE_ADMIN_TOKEN}}
            - name: WIKI_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: WIKI_ADMIN_PASSWORD}}
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 750m, memory: 1536Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: objects, mountPath: /data/objects}
            - {name: gateway-routes, mountPath: /etc/platform/gateway, readOnly: true}
      volumes:
        - name: objects
          persistentVolumeClaim: {claimName: api-objects}
        # 路由管理頁唯讀列出 Gateway 的靜態路由（GATEWAY_ROUTES_FILE）；外掛設定不回傳
        - name: gateway-routes
          configMap:
            name: apisix-config
            items: [{key: apisix.yaml, path: apisix.yaml}]
