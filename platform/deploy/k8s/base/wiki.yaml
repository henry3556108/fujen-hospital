# Wiki.js（B-08 知識庫）。資料在 PostgreSQL 的 wiki 資料庫；只有平台 API（以服務帳號）與 wiki-setup 工作連得到。
apiVersion: v1
kind: Service
metadata:
  name: wiki
spec:
  selector: {app: wiki}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki
spec:
  replicas: 1
  selector:
    matchLabels: {app: wiki}
  template:
    metadata:
      labels: {app: wiki, platform/db-client: "true"}
    spec:
      nodeSelector: {platform/pool: cpu-web}
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: wiki
          image: ai-platform/wiki
          env:
            - {name: DB_TYPE, value: postgres}
            - {name: DB_HOST, value: postgres}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_USER, value: platform}
            - name: DB_PASS
              valueFrom: {secretKeyRef: {name: platform-secrets, key: POSTGRES_PASSWORD}}
            - {name: DB_NAME, value: wiki}
            - {name: NODE_OPTIONS, value: "--max-old-space-size=256"}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /healthz, port: 3000}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 750m, memory: 448Mi}
