# S3 相容物件儲存（NIfTI／ITK／標註檔）。root 金鑰只給 MinIO 自己與 minio-init 工作；平台 API 用最小權限帳號。
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: {app: minio}
  ports:
    - {name: s3, port: 9000, targetPort: 9000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
      # Prometheus 以註記探索抓取（platform/deploy/kind/monitoring/prometheus.yaml 的 ai-platform-pods；README「監控」）
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9000", prometheus.io/path: /minio/v2/metrics/cluster}
    spec:
      nodeSelector: {platform/pool: cpu-web}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {fsGroup: 65532}
      containers:
        - name: minio
          image: ai-platform/minio
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: platform-secrets, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: platform-secrets, key: MINIO_ROOT_PASSWORD}}
            - {name: GOMEMLIMIT, value: 300MiB}
            - {name: MINIO_BROWSER, value: "off"}
            # /minio/v2/metrics/cluster 不需權杖即可讀；9000 埠只有平台後端與 monitoring 命名空間連得到（networkpolicy.yaml）
            - {name: MINIO_PROMETHEUS_AUTH_TYPE, value: public}
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 750m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 50Gi}
