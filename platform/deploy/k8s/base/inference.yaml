# 推論服務（上傳推論與線上推論）。與訓練 Job 同一個 platform-trainer 映像；只有平台 API 連得到。
apiVersion: v1
kind: Service
metadata:
  name: inference
spec:
  selector: {app: inference}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
spec:
  replicas: 1
  selector:
    matchLabels: {app: inference}
  template:
    metadata:
      labels: {app: inference}
    spec:
      nodeSelector: {platform/pool: cpu-web}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: inference
          image: ai-platform/trainer
          command: ["uvicorn", "trainer.serve:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: INFERENCE_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: platform-secrets, key: INFERENCE_ADMIN_TOKEN}}
            - {name: TRAIN_THREADS, value: "2"}
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 750m, memory: 1536Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
