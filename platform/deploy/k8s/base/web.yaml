# 網頁前端（platform/web 的正式映像，nginx 非 root）。只經 Gateway 的 9082 埠；/api 在同一個 Gateway 上，網頁與 API 同源。
# 網址在容器啟動時寫成 /config.js（WEB_* 環境變數），同一個映像用在每個環境；都是公開設定，不放密碼。
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      nodeSelector: {platform/pool: cpu-web}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 101}
      containers:
        - name: web
          image: ai-platform/web
          env:
            - {name: WEB_API_BASE, value: ""}
            - name: KC_HOSTNAME
              valueFrom: {configMapKeyRef: {name: platform-urls, key: KC_HOSTNAME}}
            - {name: WEB_OIDC_AUTHORITY, value: "$(KC_HOSTNAME)/realms/ai-platform"}
            - {name: WEB_OIDC_CLIENT_ID, value: ai-platform-web}
            - name: WEB_OHIF_BASE
              valueFrom: {configMapKeyRef: {name: platform-urls, key: OHIF_PUBLIC_URL}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /config.js, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /config.js, port: 8080}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
