# OHIF 檢視器（靜態網頁）。只經 Gateway 的 9081 埠；設定檔每個 overlay 自己提供（ohif-config）。
# 映像的 entrypoint 會把 app-config.js 壓成 .gz 再清空原檔，所以設定檔掛在別處、啟動時複製進去（與 compose 相同）。
apiVersion: v1
kind: Service
metadata:
  name: ohif
spec:
  selector: {app: ohif}
  ports:
    - {name: http, port: 80, targetPort: 80}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohif
spec:
  replicas: 1
  selector:
    matchLabels: {app: ohif}
  template:
    metadata:
      labels: {app: ohif}
    spec:
      nodeSelector: {platform/pool: cpu-web}
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: ohif
          image: ai-platform/ohif
          command: ["/bin/sh", "-c", "cp /config/app-config.js /usr/share/nginx/html/app-config.js && exec /usr/src/entrypoint.sh nginx -g 'daemon off;'"]
          ports:
            - {name: http, containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: ohif-config}
