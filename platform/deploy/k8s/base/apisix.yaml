# Gateway（APISIX standalone）：命名空間外唯一能連到平台 API、DICOMweb、FHIR 的入口。
# 9080：平台 API、DICOMweb、FHIR；9081：OHIF 檢視器（與 DICOMweb 同源）。
# 路由檔的 Orthanc 認證與 CORS 網域以 ${{VAR}} 佔位，從 Secret 與 platform-urls 注入。
apiVersion: v1
kind: Service
metadata:
  name: apisix
spec:
  selector: {app: apisix}
  ports:
    - {name: gateway, port: 9080, targetPort: 9080}
    - {name: viewer, port: 9081, targetPort: 9081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
spec:
  replicas: 1
  selector:
    matchLabels: {app: apisix}
  template:
    metadata:
      labels: {app: apisix}
    spec:
      nodeSelector: {platform/pool: cpu-web}
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: apisix
          image: ai-platform/apisix
          # FHIR 上游以 DNS 服務發現（headless Service）；DNS 伺服器取 Pod 自己的 nameserver，不寫死叢集的 kube-dns 位址
          command: ["sh", "-c", "export DNS_SERVER=$(awk '/^nameserver/{print $2; exit}' /etc/resolv.conf) && exec /docker-entrypoint.sh docker-start"]
          env:
            - name: ORTHANC_GATEWAY_AUTH
              valueFrom: {secretKeyRef: {name: platform-secrets, key: ORTHANC_GATEWAY_AUTH}}
            - name: CORS_ALLOW_ORIGINS
              valueFrom: {configMapKeyRef: {name: platform-urls, key: CORS_ALLOW_ORIGINS}}
            - name: DICOMWEB_CORS_REGEX
              valueFrom: {configMapKeyRef: {name: platform-urls, key: DICOMWEB_CORS_REGEX}}
          ports:
            - {name: gateway, containerPort: 9080}
            - {name: viewer, containerPort: 9081}
          readinessProbe:
            tcpSocket: {port: 9080}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: 9080}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {cpu: 750m, memory: 640Mi}   # 3.19 閒置約比 3.11 多 280 MB
          volumeMounts:
            - {name: config, mountPath: /usr/local/apisix/conf/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: config, mountPath: /usr/local/apisix/conf/apisix.yaml, subPath: apisix.yaml, readOnly: true}
      volumes:
        - name: config
          configMap: {name: apisix-config}
