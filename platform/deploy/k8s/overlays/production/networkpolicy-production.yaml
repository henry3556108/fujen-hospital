# 醫院 PACS 以 C-STORE 回送 C-MOVE 取回的影像到平台 Orthanc（4242）。CIDR 換成 PACS 的位址；
# PACS 要連得到 Orthanc 的 4242，需另以 NodePort／LoadBalancer 開放（依甲方網路設計，本範本不含）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orthanc-dicom-from-hospital-pacs
spec:
  podSelector:
    matchLabels: {app: orthanc}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 192.0.2.10/32}   # CHANGE-ME：醫院 PACS（192.0.2.0/24 是文件用的保留位址）
      ports:
        - {port: 4242, protocol: TCP}
---
# LLM 模型服務（ollama.yaml）：只有平台 API（對話、向量、模型載入）。不用 backend-only，一次性工作與 fhir-worker 不需要
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama
spec:
  podSelector:
    matchLabels: {app: ollama}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api}}
      ports:
        - {port: 11434, protocol: TCP}
