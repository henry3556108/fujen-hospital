# LLM 模型服務（Ollama，與 compose.ollama.yaml 相同）。只有平台 API 連得到（networkpolicy-production.yaml）。
# 模型不由 Ollama 下載：平台 API 從 Hugging Face 下載 GGUF（核對 commit 與 hash）後以 HTTP 推進來（app.llm.model_setup）。
# 唯一不在 cpu-web 的平台 Pod：排在 GPU 共享池（time-slicing 的一份），不經 Kueue，所以共享池的 Kueue 配額要少算一份
# （README「正式環境」）。要獨占一張卡時把 platform/pool 改成 gpu-exclusive，獨占池配額同樣少一張。
# /root/.ollama 是 Ollama 的模型庫，用 PVC，所以一個副本、Recreate。
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: {app: ollama}
  ports:
    - {name: http, port: 11434, targetPort: 11434}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 50Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      nodeSelector: {platform/pool: gpu-shared}
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: ollama
          image: ai-platform/ollama
          env:
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            - {name: OLLAMA_KEEP_ALIVE, value: "-1"}          # 載入後常駐，卸載由平台決定
            - {name: OLLAMA_MAX_LOADED_MODELS, value: "4"}
            - {name: OLLAMA_NUM_PARALLEL, value: "4"}
          ports:
            - {name: http, containerPort: 11434}
          startupProbe:
            httpGet: {path: /, port: 11434}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /, port: 11434}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 11434}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: 1}
            limits: {cpu: "8", memory: 32Gi, nvidia.com/gpu: 1}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /root/.ollama}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ollama-data}
