# 平台在 Kubernetes 上用到的所有映像：唯一的清單。
# manifest 只寫邏輯名稱 ai-platform/<服務>；版本、digest 只改這裡。
# build-and-load.sh 與離線安裝包（offline/bundle.sh）也從這個檔讀清單。
# 上游映像要與 compose 檔（platform/deploy/local/compose*.yaml）一致，platform/compliance/tests/test_k8s_manifests.py 會比對。
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  # ---- 上游映像 ----
  - name: ai-platform/postgres
    newName: pgvector/pgvector
    newTag: 0.8.7-pg16-trixie
  - name: ai-platform/keycloak
    newName: quay.io/keycloak/keycloak
    newTag: 26.8.0
  - name: ai-platform/apisix
    newName: apache/apisix
    newTag: 3.19.0-debian
  - name: ai-platform/orthanc
    newName: jodogne/orthanc-plugins
    newTag: 1.13.0
  - name: ai-platform/minio
    newName: cgr.dev/chainguard/minio
    newTag: latest      # 只為與 compose 的寫法一致；有 digest 時 Kustomize 只用 digest
    digest: sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
  - name: ai-platform/clamav
    newName: clamav/clamav
    newTag: 1.5.4
  - name: ai-platform/hapi
    newName: hapiproject/hapi
    newTag: v8.12.0-1
  - name: ai-platform/wiki
    newName: ghcr.io/requarks/wiki
    newTag: "2.5"
  - name: ai-platform/mlflow
    newName: ghcr.io/mlflow/mlflow
    newTag: v3.16.1
  - name: ai-platform/ohif
    newName: ohif/app
    newTag: v3.13.10
  - name: ai-platform/ollama        # 只在 production overlay（GPU 池）
    newName: ollama/ollama
    newTag: 0.40.3
  - name: ai-platform/mailpit
    newName: axllent/mailpit
    newTag: v1.31.3
  # ---- 平台自己建置的映像（build-and-load.sh；Dockerfile 在 platform/api、platform/fakes、platform/training、platform/web）----
  - name: ai-platform/api
    newName: platform-api
    newTag: dev
  - name: ai-platform/fakes
    newName: platform-fakes
    newTag: dev
  - name: ai-platform/trainer
    newName: platform-trainer
    newTag: dev
  - name: ai-platform/web
    newName: platform-web
    newTag: dev
  # ---- 只用在正式環境的自動標註工具（B-03；kind 用 fake-autolabel）。建置：platform/autolabel/build.sh ----
  - name: ai-platform/autolabel
    newName: platform-autolabel
    newTag: dev
  - name: ai-platform/monailabel       # MONAI Label＋預訓練權重，約 15 GB，只放 GPU 共享池
    newName: platform-monailabel
    newTag: dev
# 平台 API 送到叢集的 Job 用的映像（環境變數，不是 Pod 的 image 欄位，所以放在 ConfigMap）。
# 這些映像要載入工作節點（cpu-data、GPU 池），不是平台節點；GPU 映像（約 35 GB）只載入 GPU 池。
#   TRAINING_GPU_IMAGE  影像訓練與影像批次推論（NGC TensorFlow＋PyTorch，platform/training/Dockerfile.gpu）
#   TRAINING_IMAGE      結構式訓練、結構式批次推論、假訓練（與推論服務同一個映像）
configMapGenerator:
  - name: platform-images
    literals:
      - TRAINING_IMAGE=platform-trainer:dev
      - TRAINING_GPU_IMAGE=platform-trainer-gpu:dev
      - JOB_IMAGE=busybox:1.36
