# Alertmanager：告警寄到 Mailpit（甲方換成甲方告警信箱）。
# 3 類事件、3 條發送規則（合約 C-02「告警事件分類 3 類、告警發送規則 3 條」）：告警規則以 category 標籤分類，
# route.routes 一類一條，各自的分組（group_by）與重寄間隔，都寄到維運信箱：
#   job-failure  平台工作失敗（PlatformJobFailed）：依工作分組，每個失敗的 Job 一封
#   resource     資源異常（HighPodCpu）：依 Pod 分組
#   node         節點失聯（NodeNotReady）：依節點分組
# 重複抑制：
# - 同一告警群組只在第一次寄出，之後 repeat_interval（4 小時）內不再重寄；不寄「已解除」通知。
# - 節點未就緒時，抑制同一節點上的 warning 告警（避免一個根因洗版）。
# 沒有 category 的告警（將來新增規則忘了分類）走最上層的預設路由，仍會寄出。
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: mailpit.monitoring.svc:1025
      smtp_from: alertmanager@ai-platform.local
      smtp_require_tls: false
    route:
      receiver: ops-mail
      group_by: [alertname, namespace, job_name, node, pod]
      group_wait: 5s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        # 發送規則 1：平台工作失敗
        - matchers: [category = job-failure]
          receiver: ops-mail
          group_by: [alertname, namespace, job_name]
          group_wait: 5s
          group_interval: 1m
          repeat_interval: 4h
        # 發送規則 2：資源異常
        - matchers: [category = resource]
          receiver: ops-mail
          group_by: [alertname, namespace, pod, node]
          group_wait: 5s
          group_interval: 1m
          repeat_interval: 4h
        # 發送規則 3：節點失聯
        - matchers: [category = node]
          receiver: ops-mail
          group_by: [alertname, node]
          group_wait: 5s
          group_interval: 1m
          repeat_interval: 4h
    receivers:
      - name: ops-mail
        email_configs:
          - to: ops@ai-platform.local
            send_resolved: false
    inhibit_rules:
      - source_matchers: [alertname = NodeNotReady]
        target_matchers: [severity = warning]
        equal: [node]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      nodeSelector: { platform/pool: cpu-web }
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.34.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports: [{ name: http, containerPort: 9093 }]
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager }
            - { name: data, mountPath: /alertmanager }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - { name: config, configMap: { name: alertmanager-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  type: NodePort
  selector: { app: alertmanager }
  ports: [{ name: http, port: 9093, targetPort: 9093, nodePort: 30093 }]
