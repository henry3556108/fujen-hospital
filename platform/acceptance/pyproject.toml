[project]
name = "ai-platform-acceptance"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--junitxml=reports/latest/junit.xml"
markers = ["kind: 需要 kind 叢集 ai-platform（platform/deploy/kind/up.sh），以 platform/api 的環境執行"]
