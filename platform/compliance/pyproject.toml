[project]
name = "ai-platform-compliance"
version = "0.1.0"
description = "合規與交付檢查：授權清單、漏洞與來源、掃毒、稽核與監控覆蓋、測試報告、機密掃描"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
