# 監控覆蓋（TC-DAILY-02、TC-C02-01）的政策。服務清單由叢集探索，不寫在這裡。
# 叢集內這些命名空間的元件由 kind 節點映像內建，不在平台監控範圍（以 kubelet／cAdvisor 抓節點層指標）。
excluded_namespaces: [kube-system, local-path-storage, kube-public, kube-node-lease]
# 覆蓋方式（每個服務恰好一種）：
#   1. 抓取目標：服務自己有 /metrics，Prometheus 有同名、狀態 up 的抓取工作。
#      平台（ai-platform）的抓取對象由 Pod 註記 prometheus.io/scrape 宣告（platform/deploy/k8s/base），
#      目前是 api、apisix、keycloak、minio；Prometheus 以 ai-platform-pods 工作探索（platform/deploy/kind/monitoring/prometheus.yaml）。
#   2. 只以容器指標覆蓋：沒有可用的 /metrics 端點，以 cAdvisor 的容器 CPU、記憶體、網路、重啟指標監控（下列清單）。
#      新增服務若沒有抓取目標又不在這裡，檢查會失敗；platform/compliance/tests/test_monitoring_config.py 也會擋下。
container_metrics_only:
  # 開發與驗收用（kind）
  - monitoring/mailpit                # 告警收件匣，沒有 /metrics
  - platform-web/web-echo             # 測試用網頁服務
  # 平台（ai-platform）
  - ai-platform/postgres              # 需另裝 postgres_exporter；以容器指標加平台 API 的請求延遲觀察
  - ai-platform/orthanc               # /tools/metrics-prometheus 需要 Orthanc 管理帳號，不交給監控
  - ai-platform/hapi                  # HAPI FHIR 映像未開 Spring actuator 的 prometheus 端點
  - ai-platform/mlflow                # 映像沒有 prometheus-flask-exporter（--expose-prometheus 無法使用）
  - ai-platform/clamav                # clamd 沒有 HTTP 端點
  - ai-platform/wiki                  # Wiki.js 沒有 /metrics
  - ai-platform/ohif                  # 靜態檔案（nginx）
  - ai-platform/web                   # 靜態檔案（nginx）
  - ai-platform/fhir-worker           # 背景工作，沒有 HTTP 服務；處理結果記在平台資料庫
  - ai-platform/inference             # 推論服務，沒有 /metrics；經 Gateway 的請求由 apisix 指標涵蓋
  - ai-platform/fake-llm              # kind 才有的假 LLM
  - ai-platform/autolabel             # kind 才有的假自動標註
  - ai-platform/mailpit               # kind 才有：平台寄出的通知信收件匣
  - ai-platform/orthanc-pacs          # kind 才有：模擬醫院 PACS
# 每個節點都必須有這些抓取工作
per_node_jobs: [kubelet, cadvisor]
